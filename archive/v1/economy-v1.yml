name: Live Economy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cymonia-live-economy
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current economy
        run: python -m cymonia verify --root state
      - name: Advance one epoch
        run: python -m cymonia step --root state
      - name: Rebuild public dashboard data
        run: python scripts/build_site.py
      - name: Verify new economy
        run: python -m cymonia verify --root state
      - name: Advance persistent Autonomous World through its transactional API
        env:
          CYMONIA_WORLD_URL: ${{ vars.CYMONIA_WORLD_URL || 'https://cymonia.pages.dev' }}
          WORLD_ADVANCE_TOKEN: ${{ secrets.WORLD_ADVANCE_TOKEN }}
        run: node scripts/advance_remote_world.mjs
      - name: Commit new economic state
        run: |
          git config user.name "cymonia-governor[bot]"
          git config user.email "cymonia-governor[bot]@users.noreply.github.com"
          git add state site/data
          if git diff --cached --quiet; then
            echo "No economic state change to commit"
            exit 0
          fi
          EPOCH=$(python - <<'PY'
          import json
          print(json.load(open('state/state.json'))['epoch'])
          PY
          )
          git commit -m "economy: advance to epoch ${EPOCH}"
          git push
