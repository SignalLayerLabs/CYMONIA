name = "cymonia-sovereign-world"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["* * * * *"]

[ai]
binding = "AI"

[vars]
HUMAN_SYSTEM_REPAIR_ID = "2026-10-30-github-survival-recovery"
SYSTEM_REPAIR_ID = "2026-10-30-survival-deterioration"
BRAIN_MODEL = "@cf/zai-org/glm-4.7-flash"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "SovereignWorld"

[[migrations]]
tag = "sovereign-v2-genesis"
new_sqlite_classes = ["SovereignWorld"]
