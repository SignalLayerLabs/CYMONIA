name: V1 Historical Prototype Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v1-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical v1 state without advancing it
        run: |
          python -m cymonia verify --root state
          echo "CYMONIA v1 is a historical prototype. This workflow never advances the v2 canonical world."
