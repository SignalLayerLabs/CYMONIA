name: Runtime diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@4
      - name: Read bounded runtime diagnostics with sanitized output
        run: |
          TAIL_STATUS=0
          timeout 110s npx wrangler tail cymonia-sovereign-world --config wrangler.world.toml --format json >/tmp/runtime-tail.json 2>/tmp/runtime-tail-errors.log || TAIL_STATUS=$?
          test "$TAIL_STATUS" -eq 0 -o "$TAIL_STATUS" -eq 124
          python3 <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/runtime-tail.json').read_text()[:8_000_000]
          decoder=json.JSONDecoder();cursor=0;count=0
          while cursor<len(text):
              start=text.find('{',cursor)
              if start<0:break
              try:entry,cursor=decoder.raw_decode(text,start)
              except ValueError:cursor=start+1;continue
              event=entry.get('event') or {}
              count+=1
              print(json.dumps({'outcome':entry.get('outcome'),'cpuTime':entry.get('cpuTime'),'wallTime':entry.get('wallTime'),'kind':'fetch' if 'request' in event else 'alarm','exceptions':entry.get('exceptions',[]),'logs':[line for line in entry.get('logs',[]) if any(str(m).startswith('CYMONIA_') for m in line.get('message',[]))]}))
          print(f'Runtime events: {count}')
          if not count:raise SystemExit('No runtime events observed')
          PY
