name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript domain and frontend tests
        run: node --test tests/test_ui.mjs tests/test_economy.mjs tests/test_store.mjs tests/test_api.mjs tests/test_participate.mjs
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic 100-epoch smoke economy
        run: |
          rm -rf /tmp/cymonia-smoke
          python -m cymonia init --root /tmp/cymonia-smoke --seed 20260911
          python -m cymonia run --root /tmp/cymonia-smoke --epochs 100
          python -m cymonia verify --root /tmp/cymonia-smoke
      - name: Build dashboard data
        run: python scripts/build_site.py
      - name: Reproduce published research
        run: |
          python scripts/build_experiments.py
          git diff --exit-code -- site/data/experiments.json

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static data
        run: |
          python scripts/build_site.py
          python scripts/build_experiments.py
      - name: Install Playwright for integration smoke
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser integration smoke
        run: |
          python -m http.server 8765 --directory site >/tmp/cymonia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser.mjs
