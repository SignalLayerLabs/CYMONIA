name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sovereign-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sovereign World unit and invariant tests
        run: node --test tests/test_sovereign_*.mjs
      - name: Rebuild deterministic Sovereign Genesis replay
        run: |
          node scripts/build_sovereign_genesis.mjs
          cp site/data/sovereign-genesis.json /tmp/sovereign-genesis-a.json
          node scripts/build_sovereign_genesis.mjs
          cmp /tmp/sovereign-genesis-a.json site/data/sovereign-genesis.json
      - name: Static game-shell and package verification
        run: bash CHECK.sh . --skip-browser

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for integration smoke
        run: |
          npm install --no-save playwright pixi.js@8.19.0
          npx playwright install --with-deps chromium
      - name: Serve Observer shell and run sovereign browser smoke
        run: |
          python3 -m http.server 8765 --directory site >/tmp/cymonia-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser-replay.mjs
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser-sovereign.mjs
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser-state-sprites.mjs
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser-graphics2.mjs

  heartbeat-diagnostics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/cymonia-25-production-heartbeat'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@4
      - name: Read bounded alarm diagnostics without exposing HTTP headers
        run: |
          TAIL_STATUS=0
          timeout 100s npx wrangler tail cymonia-sovereign-world --config wrangler.world.toml --format json >/tmp/heartbeat-tail.json 2>/tmp/heartbeat-tail-errors.log || TAIL_STATUS=$?
          echo "Tail exit status: $TAIL_STATUS (124 is the bounded observation timeout)"
          python3 <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/heartbeat-tail.json').read_text()[:8_000_000]
          decoder=json.JSONDecoder();cursor=0;count=0
          while cursor<len(text):
              start=text.find('{',cursor)
              if start<0:break
              try:entry,cursor=decoder.raw_decode(text,start)
              except ValueError:cursor=start+1;continue
              event=entry.get('event') or {}
              if not isinstance(event,dict) or 'request' in event:continue
              count+=1
              print(json.dumps({'outcome':entry.get('outcome'),'cpuTime':entry.get('cpuTime'),'wallTime':entry.get('wallTime'),'scheduledTime':event.get('scheduledTime'),'exceptions':entry.get('exceptions',[]),'logs':[line for line in entry.get('logs',[]) if any(str(m).startswith('CYMONIA_') for m in line.get('message',[]))]}))
          print(f'Non-HTTP runtime events: {count}')
          PY

  deploy-world:
    name: Deploy Sovereign World Worker
    needs: [sovereign-test, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cymonia-sovereign-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy canonical Durable Object world
        run: npx wrangler deploy --config wrangler.world.toml

  deploy-pages:
    name: Deploy Observer Pages
    needs: [deploy-world]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cymonia-sovereign-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Build deterministic Observer fallback
        run: node scripts/build_sovereign_genesis.mjs
      - name: Deploy game-only Observer
        run: npx wrangler pages deploy site --project-name cymonia --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify canonical state advances in production
        run: |
          for i in $(seq 1 30); do
            rm -f /tmp/cymonia-health-a.json /tmp/cymonia-state-a.json
            curl --max-time 15 -fsS -o /tmp/cymonia-health-a.json https://cymonia.pages.dev/api/v2/health 2>/dev/null || true
            curl --max-time 15 -fsS -o /tmp/cymonia-state-a.json https://cymonia.pages.dev/api/v2/state 2>/dev/null || true
            node -e "const fs=require('fs');try{const h=JSON.parse(fs.readFileSync('/tmp/cymonia-health-a.json'));const x=JSON.parse(fs.readFileSync('/tmp/cymonia-state-a.json'));process.exit(h.ok&&h.service==='cymonia-sovereign-world'&&Number.isFinite(h.world_minute)&&h.persisted_generation&&x.ok&&x.world?.version===2&&x.world.citizens?.length>0&&x.world.citizens.some(c=>c.alive&&c.currentAction)?0:1)}catch{process.exit(1)}" && break
            sleep 2
          done
          test -s /tmp/cymonia-health-a.json
          # Canonical advancement is alarm-driven. Production uses a
          # 60-second alarm cadence, so allow more than two alarm windows
          # plus normal Cloudflare scheduling jitter.
          for i in $(seq 1 75); do
            curl --max-time 15 -fsS -o /tmp/cymonia-health-b.json https://cymonia.pages.dev/api/v2/health 2>/dev/null || true
            node -e "const fs=require('fs');try{const a=JSON.parse(fs.readFileSync('/tmp/cymonia-health-a.json'));const b=JSON.parse(fs.readFileSync('/tmp/cymonia-health-b.json'));process.exit(b.world_minute>a.world_minute?0:1)}catch{process.exit(1)}" && break
            sleep 2
          done

          # Persistence is intentionally throttled for the Durable Objects
          # free-tier write budget. Allow one checkpoint interval to pass.
          for i in $(seq 1 45); do
            curl --max-time 15 -fsS -o /tmp/cymonia-health-c.json https://cymonia.pages.dev/api/v2/health 2>/dev/null || true
            node -e "const fs=require('fs');try{const a=JSON.parse(fs.readFileSync('/tmp/cymonia-health-a.json'));const c=JSON.parse(fs.readFileSync('/tmp/cymonia-health-c.json'));process.exit(c.persisted_generation&&c.persisted_generation!==a.persisted_generation?0:1)}catch{process.exit(1)}" && break
            sleep 2
          done
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/cymonia-health-a.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/cymonia-health-b.json'));
          const c=JSON.parse(fs.readFileSync('/tmp/cymonia-health-c.json'));
          console.log('health-a',a);
          console.log('health-b',b);
          console.log('health-c',c);
          if(!b.ok||b.service!=='cymonia-sovereign-world')throw new Error('canonical health unavailable');
          if(!(b.world_minute>a.world_minute))throw new Error(`canonical world minute did not advance; heartbeat=${JSON.stringify(b.heartbeat||{})}; lag=${b.lag_world_minutes}`);
          if(!c.persisted_generation||c.persisted_generation===a.persisted_generation)throw new Error(`canonical snapshot was not persisted within checkpoint window; heartbeat=${JSON.stringify(c.heartbeat||{})}; persistence=${JSON.stringify(c.persistence_budget||{})}`);
          console.log({from:a.world_minute,to:b.world_minute,persisted_generation:c.persisted_generation});
          NODE

      - name: Verify production WebSocket stability
        run: |
          node <<'NODE'
          const ws=new WebSocket('wss://cymonia.pages.dev/api/v2/stream');
          let done=false,snapshot=false;
          const deadline=setTimeout(()=>finish(1,'production websocket timed out'),10_000);
          function finish(code,message){
            if(done)return;
            done=true;
            clearTimeout(deadline);
            if(code===0)console.log(message);
            else console.error(message);
            try{ws.close(1000,'ci-complete');}catch{}
            setTimeout(()=>process.exit(code),100);
          }
          ws.addEventListener('message',event=>{
            try{
              const message=JSON.parse(String(event.data));
              if(message.type==='world_snapshot'&&message.state?.version===2)snapshot=true;
            }catch{}
          });
          ws.addEventListener('error',()=>finish(1,'production websocket emitted an error'));
          ws.addEventListener('close',event=>{
            if(!done)finish(1,`production websocket closed early: code=${event.code} reason=${event.reason||''}`);
          });
          ws.addEventListener('open',()=>{
            setTimeout(()=>{
              if(!snapshot)return finish(1,'production websocket did not deliver canonical snapshot');
              finish(0,'PASS: production websocket remained open for 5s and delivered canonical snapshot');
            },5_000);
          });
          NODE
