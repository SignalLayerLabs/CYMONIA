name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sovereign-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sovereign World unit and invariant tests
        run: node --test tests/test_sovereign_*.mjs
      - name: Rebuild deterministic Sovereign Genesis replay
        run: |
          node scripts/build_sovereign_genesis.mjs
          cp site/data/sovereign-genesis.json /tmp/sovereign-genesis-a.json
          node scripts/build_sovereign_genesis.mjs
          cmp /tmp/sovereign-genesis-a.json site/data/sovereign-genesis.json
      - name: Static game-shell and package verification
        run: bash CHECK.sh . --skip-browser

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for integration smoke
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve Observer shell and run sovereign browser smoke
        run: |
          python3 -m http.server 8765 --directory site >/tmp/cymonia-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser-sovereign.mjs

  deploy-world:
    name: Deploy Sovereign World Worker
    needs: [sovereign-test, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cymonia-sovereign-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy canonical Durable Object world
        run: npx wrangler deploy --config wrangler.world.toml

  deploy-pages:
    name: Deploy Observer Pages
    needs: [sovereign-test, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cymonia-sovereign-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Build deterministic Observer fallback
        run: node scripts/build_sovereign_genesis.mjs
      - name: Deploy game-only Observer
        run: npx wrangler pages deploy site --project-name cymonia --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify canonical state advances in production
        run: |
          for i in $(seq 1 30); do
            rm -f /tmp/cymonia-state-a.json
            curl --max-time 15 -fsS -o /tmp/cymonia-state-a.json https://cymonia.pages.dev/api/v2/state 2>/dev/null || true
            node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/cymonia-state-a.json'));process.exit(x.ok&&x.world?.citizens?.length===100?0:1)}catch{process.exit(1)}" && break
            sleep 2
          done
          test -s /tmp/cymonia-state-a.json
          sleep 3
          curl --max-time 15 -fsS -o /tmp/cymonia-state-b.json https://cymonia.pages.dev/api/v2/state
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/cymonia-state-a.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/cymonia-state-b.json'));
          if(!b.ok||b.world?.citizens?.length!==100)throw new Error('canonical state unavailable');
          if(!(b.world.clock.worldMinute>a.world.clock.worldMinute))throw new Error('world clock did not advance');
          if(!b.world.citizens.some(c=>c.currentAction?.type==='MOVE'))throw new Error('no Citizen movement is active');
          console.log({from:a.world.clock.worldMinute,to:b.world.clock.worldMinute,moving:b.world.citizens.filter(c=>c.currentAction?.type==='MOVE').length});
          NODE
