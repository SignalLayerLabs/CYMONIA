name: CI

on:
  push:
    paths-ignore:
      - 'state/**'
      - 'site/data/state.json'
      - 'site/data/history.json'
      - 'site/data/policy.json'
      - 'site/data/transactions.json'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript domain and frontend tests
        run: node --test tests/test_*.mjs
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic 100-epoch smoke economy
        run: |
          rm -rf /tmp/cymonia-smoke
          python -m cymonia init --root /tmp/cymonia-smoke --seed 20260911
          python -m cymonia run --root /tmp/cymonia-smoke --epochs 100
          python -m cymonia verify --root /tmp/cymonia-smoke
      - name: Build dashboard data
        run: python scripts/build_site.py
      - name: Build deterministic Autonomous World replay
        run: |
          node scripts/build_world_replay.mjs
          cp site/data/world.json /tmp/world-a.json
          node scripts/build_world_replay.mjs
          cmp /tmp/world-a.json site/data/world.json
      - name: Reproduce published research
        run: |
          python scripts/build_experiments.py
          node scripts/build_world_replay.mjs
          git diff --exit-code -- site/data/experiments.json

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static data
        run: |
          python scripts/build_site.py
          python scripts/build_experiments.py
          node scripts/build_world_replay.mjs
      - name: Install Playwright for integration smoke
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser integration smoke
        run: |
          python -m http.server 8765 --directory site >/tmp/cymonia-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          SERVER_READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1; then
              SERVER_READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$SERVER_READY" -ne 1 ]; then
            echo "Static test server did not become ready"
            cat /tmp/cymonia-http.log || true
            exit 1
          fi
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser.mjs
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser-world.mjs
          CYMONIA_URL=http://127.0.0.1:8765 node tests/browser-game-revamp.mjs

  deploy-cloudflare:
    name: Deploy Cloudflare production
    needs: [test, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production assets
        run: |
          python scripts/build_site.py
          python scripts/build_experiments.py
          node scripts/build_world_replay.mjs
      - name: Validate Cloudflare deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install Cloudflare Wrangler
        run: npm install --no-save wrangler@4
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply cymonia-participation --remote --env production
      - name: Deploy Pages and Functions to Cloudflare
        run: npx wrangler pages deploy site --project-name cymonia --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify Cloudflare production health
        run: |
          for i in $(seq 1 30); do
            BODY=$(curl -fsS https://cymonia.pages.dev/api/health 2>/dev/null || true)
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q '@cf/zai-org/glm-4.7-flash' && echo "$BODY" | grep -q '"personal_agent_ai":"workers-ai"' && echo "$BODY" | grep -q '"d1_bound":true'; then
              echo "$BODY"
              exit 0
            fi
            sleep 2
          done
          echo "Cloudflare production health check failed"
          exit 1

